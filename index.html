<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8th Hour Collective LLC</title>
<meta name="description" content="8th Hour Collective LLC, creator of ReConCel.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --brand: #8233fa; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111; --brand: #b08cff; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }

  header { text-align: center; padding: 40px 16px 0; }
  header h1 { font-size: 2.4em; line-height: 1.1; margin: 0; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px 64px; text-align: center; }
  .intro { margin: 0 0 20px; color: var(--muted); font-size: 1.2em; }
  .product { display: flex; flex-direction: column; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
  .product img { width: 128px; height: 128px; border-radius: 28px; }
  .product h2 { font-size: 2em; line-height: 1.1; margin: 4px 0 0; }
  .tagline { margin: 0; color: var(--muted); font-size: 1.15em; }
  .tagline b { color: var(--brand); }
  .product:hover h2, .product:focus-visible h2 { text-decoration: underline; }

  footer { text-align: center; padding: 0 16px 32px; color: var(--muted); font-size: .9em; }
</style>
</head>
<body>
  <header>
    <h1>8th Hour Collective LLC</h1>
  </header>

  <main>
    <p class="intro">Creator of</p>
    <a class="product" href="https://reconcel.com">
      <img src="images/logo.png" alt="">
      <h2>ReConCel</h2>
      <p class="tagline"><b>Re</b>member. <b>Con</b>nect. <b>Cel</b>ebrate.</p>
    </a>
  </main>

  <footer>© 2026 8th Hour Collective LLC. All rights reserved.</footer>
</body>
</html>
